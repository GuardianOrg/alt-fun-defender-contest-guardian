  indexer-smoke:
    name: Indexer Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-js-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-js-${{ runner.os }}-

      - name: Build shared package
        run: npx turbo run build --filter=@launchpad/shared

      - name: Smoke test indexer
        run: npm run test:smoke --workspace=@launchpad/indexer
        timeout-minutes: 5
        env:
          PONDER_RPC_URL_999: ${{ secrets.PONDER_RPC_URL_999 }}
