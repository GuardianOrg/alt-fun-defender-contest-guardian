<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link
      rel="icon"
      type="image/x-icon"
      href="/favicon/favicon-v2.ico"
      sizes="any"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon/favicon-96x96.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>Alt Fun - Launch coins backed by Hyperliquid perps</title>
    <meta
      name="description"
      content="Alt Fun is a token launchpad on HyperEVM. Every token is backed by a Hyperliquid perp — so prices move even when nobody trades."
    />
    <meta name="theme-color" content="#061E1C" />

    <!-- No `<link rel="canonical">` here on purpose. A site-wide canonical
         pointing at `https://alt.fun/` shipped on every route (token detail,
         create, profile, …) and was deduping every page back into the
         homepage in Google's index. Per-route canonicals live in the route
         components and are set at render time via `@unhead/react` (see
         issue tracker → SEO P1). -->
    <meta property="og:site_name" content="Alt Fun" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alt.fun/" />
    <meta
      property="og:title"
      content="Alt Fun - Launch coins backed by Hyperliquid perps"
    />
    <meta
      property="og:description"
      content="Launch coins backed by Hyperliquid perps. Tokens that move even when nobody trades."
    />
    <meta property="og:image" content="https://alt.fun/og-image.png" />
    <meta
      property="og:image:secure_url"
      content="https://alt.fun/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Alt Fun - token launchpad on HyperEVM, backed by Hyperliquid perps"
    />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@altdotfun" />
    <meta name="twitter:creator" content="@altdotfun" />
    <meta
      name="twitter:title"
      content="Alt Fun - Launch coins backed by Hyperliquid perps"
    />
    <meta
      name="twitter:description"
      content="Launch coins backed by Hyperliquid perps. Tokens that move even when nobody trades."
    />
    <meta name="twitter:image" content="https://alt.fun/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Alt Fun - token launchpad on HyperEVM, backed by Hyperliquid perps"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
