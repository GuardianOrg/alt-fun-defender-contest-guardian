name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: npm ci

      - name: CI
        run: npm run ci

      - name: Security audit
        run: npm audit --omit=dev
        continue-on-error: true

  api-smoke:
    name: API Smoke Test
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: npm ci

      - name: Build shared package
        run: npx turbo run build --filter=@launchpad/shared

      - name: Create .dev.vars
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > apps/api/.dev.vars
          echo "PONDER_URL=http://localhost:42069" >> apps/api/.dev.vars
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Smoke test API
        run: npm run test:worker --workspace=@launchpad/api
        timeout-minutes: 3

  indexer-smoke:
    name: Indexer Smoke Test
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: npm ci

      - name: Build shared package
        run: npx turbo run build --filter=@launchpad/shared

      - name: Smoke test indexer
        run: npm run test:smoke --workspace=@launchpad/indexer
        timeout-minutes: 5
        env:
          PONDER_RPC_URL_999: ${{ secrets.PONDER_RPC_URL_999 }}
