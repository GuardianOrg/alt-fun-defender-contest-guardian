name: Tests

on:
  pull_request:

jobs:
  validations:
    name: Validations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate SIMULATED_ACCOUNT is null
        run: |
          if ! grep -q 'const SIMULATED_ACCOUNT.*= null;' src/web3/views/useBounceAccount.ts; then
            echo "ERROR: SIMULATED_ACCOUNT must be set to null. This is a security requirement."
            exit 1
          fi
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: yarn test
