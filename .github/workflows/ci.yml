name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-checks:
    name: JS/TS Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-js-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-js-${{ runner.os }}-

      - name: Lint, Typecheck, Test, Build (excluding contracts)
        run: npx turbo run lint typecheck test build --filter='!@launchpad/contracts'

      - name: Security audit
        run: npm audit --omit=dev
        continue-on-error: true

  contracts:
    # Foundry parallelises across contracts but each contract runs single
    # threaded, so on a 2-vCPU runner the suite is bottlenecked by the slowest
    # individual contract. Heavy shard groups every fuzz-heavy / graduation-
    # exercising suite (Bonding, Zap, GraduationInvariants, Clones,
    # HostilePreSeed) so they run concurrently inside one job; light shard
    # mops up everything else (small unit suites, all sub-second).
    # The CI foundry profile (`fuzz.runs = 24`) is what lets the heavy shard
    # finish in ~3 minutes; nightly runs the default profile for full coverage.
    name: Contracts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: heavy
            args: --match-contract "^(BondingTest|ZapTest|GraduationInvariantsTest|ClonesTest|HostilePreSeedTest)$"
          - shard: light
            args: --no-match-contract "^(BondingTest|ZapTest|GraduationInvariantsTest|ClonesTest|HostilePreSeedTest)$"
    steps:
      - uses: actions/checkout@v6

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry artifacts
        uses: actions/cache@v5
        with:
          path: |
            packages/contracts/cache
            packages/contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml', 'packages/contracts/remappings.txt', 'packages/contracts/src/**/*.sol', 'packages/contracts/test/**/*.sol', 'packages/contracts/lib/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-

      - name: forge fmt --check
        if: matrix.shard == 'light'
        working-directory: packages/contracts
        run: forge fmt --check

      - name: forge test
        working-directory: packages/contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test ${{ matrix.args }}

  api-smoke:
    name: API Smoke Test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-js-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-js-${{ runner.os }}-

      - name: Build shared package
        run: npx turbo run build --filter=@launchpad/shared

      - name: Create .dev.vars
        if: env.DATABASE_URL != ''
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > apps/api/.dev.vars
          echo "PONDER_URL=http://localhost:42069" >> apps/api/.dev.vars

      - name: Smoke test API
        if: env.DATABASE_URL != ''
        run: npm run test:worker --workspace=@launchpad/api
        timeout-minutes: 3

  indexer-smoke:
    name: Indexer Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-js-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-js-${{ runner.os }}-

      - name: Build shared package
        run: npx turbo run build --filter=@launchpad/shared

      - name: Smoke test indexer
        run: npm run test:smoke --workspace=@launchpad/indexer
        timeout-minutes: 5
        env:
          PONDER_RPC_URL_999: ${{ secrets.PONDER_RPC_URL_999 }}
