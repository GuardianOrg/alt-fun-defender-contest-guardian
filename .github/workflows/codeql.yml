name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.mjs'
      - '**/*.cjs'
      - 'package-lock.json'
      - '**/package.json'
      - '.github/workflows/codeql.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          ram: 6144
          threads: 0
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/build'
              - '**/.next'
              - '**/.turbo'
              - '**/*.min.js'
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/*.spec.ts'
              - 'apps/indexer/generated'
              - 'packages/shared/src/abis'
              - 'scripts'
              - 'docs'

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Upload disabled: repository does not have GitHub Code Security enabled.
          # Set to "always" once Advanced Security is activated in repo settings.
          upload: never
