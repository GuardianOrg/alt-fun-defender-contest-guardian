name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - run: npm ci

      - name: CI
        run: npm run ci

      - name: Security audit
        run: npm audit --omit=dev
        continue-on-error: true

  indexer-smoke:
    name: Indexer Smoke Test
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build shared package
        run: npm run build --workspace=@launchpad/shared

      - name: Smoke test indexer
        run: npm run test:smoke --workspace=@launchpad/indexer
        env:
          PONDER_RPC_URL_999: ${{ secrets.PONDER_RPC_URL_999 }}
