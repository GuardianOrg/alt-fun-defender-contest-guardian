name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The four JS/TS turbo tasks (lint, typecheck, test, build) run as separate
  # parallel jobs so wall-time is gated by the slowest single task rather than
  # by the sum at 4-vCPU turbo concurrency. Each pays a small setup tax
  # (~20s with cached node_modules), but they run concurrently. Per-task turbo
  # cache keys keep each job's `.turbo` upload independent.
  lint:
    name: JS/TS Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-lint-${{ runner.os }}-

      - name: Lint (excluding contracts)
        run: npx turbo run lint --filter='!@launchpad/contracts'

  typecheck:
    name: JS/TS Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-typecheck-${{ runner.os }}-

      - name: Typecheck (excluding contracts)
        run: npx turbo run typecheck --filter='!@launchpad/contracts'

  test:
    name: JS/TS Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      - name: Test (excluding contracts)
        run: npx turbo run test --filter='!@launchpad/contracts'

  build:
    name: JS/TS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      - name: Build (excluding contracts)
        run: npx turbo run build --filter='!@launchpad/contracts'

      - name: Security audit
        run: npm audit --omit=dev
        continue-on-error: true

  contracts:
    # Foundry parallelises across contracts but each contract runs single
    # threaded, so on a 2-vCPU runner the suite is bottlenecked by the slowest
    # individual contract. We bin-pack the suites across three shards so the
    # slowest single contract per shard is roughly the same — cuts total CI
    # wall time well below what a single heavy shard could achieve under
    # 2-vCPU contention. The CI foundry profile (`fuzz.runs = 24`) plus
    # per-test natspec overrides on the slowest fuzz tests (the
    # GraduationInvariants graduation-cycle fuzz) is what keeps each shard
    # under ~2 minutes; nightly runs the default profile for full coverage.
    name: Contracts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: graduation
            args: --match-contract "^GraduationInvariantsTest$"
          - shard: bonding
            args: --match-contract "^(BondingTest|ClonesTest)$"
          - shard: rest
            args: --no-match-contract "^(GraduationInvariantsTest|BondingTest|ClonesTest)$"
    steps:
      - uses: actions/checkout@v6

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned, not `stable`. `stable` makes foundryup resolve the tag via
          # api.github.com/repos/foundry-rs/foundry/releases/latest unauthenticated,
          # which hits GitHub's 60 req/hr/IP anon limit on shared runner IPs and 403s
          # the toolchain install. Concrete tags short-circuit that API call. Bump
          # intentionally; nightly tracks the same pin.
          version: v1.7.1

      - name: Cache Foundry artifacts
        uses: actions/cache@v5
        with:
          path: |
            packages/contracts/cache
            packages/contracts/out
          key: foundry-${{ runner.os }}-${{ hashFiles('packages/contracts/foundry.toml', 'packages/contracts/remappings.txt', 'packages/contracts/src/**/*.sol', 'packages/contracts/test/**/*.sol', 'packages/contracts/lib/**/*.sol') }}
          restore-keys: foundry-${{ runner.os }}-

      - name: forge fmt --check
        if: matrix.shard == 'rest'
        working-directory: packages/contracts
        run: forge fmt --check

      - name: forge test
        working-directory: packages/contracts
        env:
          FOUNDRY_PROFILE: ci
        run: forge test ${{ matrix.args }}

  # Live-DB integration tests for the `/api/v1/analytics/*` endpoints.
  # Gated on the `DATABASE_URL` secret being configured — the suite uses
  # `describe.skipIf(!process.env.DATABASE_URL)` so a missing secret is a
  # quiet "all-skipped" pass rather than a red CI. Configure the secret
  # at `Settings → Secrets and variables → Actions → DATABASE_URL` to
  # opt the repo in. The check is shape-only (no value pinning) so a
  # changing prod indexer state doesn't break the gate.
  api-analytics-integration:
    name: API Analytics Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v5
        with:
          path: "**/node_modules"
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run postinstall (cached path)
        if: steps.nm-cache.outputs.cache-hit == 'true'
        run: node scripts/fix-ink-react.mjs

      - name: Build shared package
        run: npx turbo run build --filter=@launchpad/shared

      - name: Run analytics integration tests
        # Vitest auto-skips the gated `describe` blocks when DATABASE_URL
        # is unset, so this step is a clean pass on forks / repos
        # without the secret configured. When the secret is present
        # the suite runs read-only `SELECT` queries against the URL —
        # prefer a Neon branch URL per `.cursor/rules/testing.mdc`
        # ("Test database queries against a Neon branch, not
        # production"). DB secrets are scoped to this single step so
        # the checkout / cache / install steps above never see them.
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BOUNCETECH_DATABASE_URL: ${{ secrets.BOUNCETECH_DATABASE_URL }}
        run: npx vitest run src/__tests__/analytics.integration.test.ts
        timeout-minutes: 5

  # Temporarily disabled — both smoke jobs hit the shared Neon DB and
  # were compounding an ongoing database load issue. Re-enable once the
