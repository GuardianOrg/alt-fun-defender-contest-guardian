name: Deploy Telegram Bot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-telegram-bot
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache Turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: npm ci

      - run: npx turbo run build --filter=@launchpad/shared

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/telegram-bot
          command: deploy

      # `setWebhook`'s `allowed_updates` list is sticky on Telegram's side —
      # if the bot grows a new update type (e.g. callback_query for inline
      # keyboards), an old registration will silently drop those updates and
      # the Worker will see nothing. Re-running set-webhook every deploy
      # keeps the registered list in sync with `routes/admin.ts`.
      - name: Register Telegram webhook
        env:
          WORKER_URL: ${{ vars.TELEGRAM_BOT_WORKER_URL }}
          ADMIN_API_KEY: ${{ secrets.TELEGRAM_BOT_ADMIN_API_KEY }}
        run: apps/telegram-bot/scripts/register-webhook.sh
